<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <script>
        // Check if the current path is /side or contains /side/
        const currentPath = window.location.pathname;
        
        // If the path includes '/side', don't redirect (allow the page to load normally)
        if (currentPath.includes('/side')) {
            // Do nothing - let the current page render
        } else {
            // Redirect to filmuniversitaet.de for all other paths
            window.location.replace('https://www.filmuniversitaet.de/');
        }
    </script>
</head>
<body>
    <!-- This page redirects to https://www.filmuniversitaet.de/ unless you visit /side -->
    <noscript>
        <p>If you are not redirected automatically, please visit <a href="https://www.filmuniversitaet.de/">https://www.filmuniversitaet.de/</a></p>
    </noscript>
</body>
</html>
